name: brew test-bot

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-bot:
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-
      - run: brew test-bot --only-cleanup-before
      - run: brew test-bot --only-setup
      - run: brew test-bot --only-tap-syntax

  # Aggregator job. Name MUST stay exactly "CI Summary".
  # Informational for now: this PR does not change rulesets or required checks.
  # Fails if any needed job failed or was cancelled. A needed job that was
  # skipped (path-gated or Graphite optimizer skip) is treated as passing.
  ci-summary:
    name: CI Summary
    runs-on: macos-latest
    timeout-minutes: 5
    permissions: {}
    needs: [test-bot]
    if: always()
    steps:
      - name: Evaluate needed job results
        env:
          NEEDS_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $NEEDS_RESULTS"
          for r in $NEEDS_RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::CI Summary: a needed job finished as '$r'"; exit 1 ;;
            esac
          done
          echo "CI Summary: all needed jobs succeeded or were skipped"
